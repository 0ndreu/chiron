# lab settings (program.md section 3). the scripts read dates and costs only from here.
periods:
  train: 2007-04-01
  validation: 2012-01-01
  holdout: 2026-07-01   # the day after the latest training cutoff of the lab models (Sonnet 5.5, Haiku 5.5: Jun 2026)
  week_1: 2026-11-09    # the course, the paper portfolio and the forward period start
costs:
  capital: 5000
  fee: 1.0          # Revolut Standard, per order
  spread_bps: 0     # [Y]: the user's W2 homework
  min_trade: 0.01   # gaps under 1% of the portfolio aren't traded
approved_libraries: []  # beyond pandas, numpy, scipy, statsmodels; the user adds a name after approving it
budget:
  state_db: ~/.hermes/state.db
  month_usd: 22          # Nous Portal Plus credits
  billing_day: 1         # the day of the month the credits renew (Portal: Dec 1)
  reserve: 0.10          # money builds up daily: 22 x 0.90 / days in the cycle
  margin: 0.20           # Hermes cost estimates are lower bounds
  user_jobs:             # [weekday (0 = Monday), expected usd] of the user's jobs; null until the week-0 measurement
    - [0, null]          # Monday kickoff
    - [2, null]          # Wednesday quiz
    - [6, null]          # Sunday 10:30 reminder (cheap model)
    - [6, null]          # Sunday 11:00 lesson (interactive, never skipped)
    - [6, null]          # Sunday 19:00 check
  prices:                # usd per M input / output tokens (Portal, 2026-11-01), only for sessions Hermes gives no cost
    anthropic/claude-sonnet-5.5: [2.00, 10.00]
    anthropic/claude-haiku-5.5: [0.10, 0.50]
